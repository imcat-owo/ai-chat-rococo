<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小家 · AI 聊天</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 一套默认主题：浅奶粉底 + 豆沙玫瑰。没有预设主题包，颜色、壁纸、头像都由使用者自己调、自己传。 */
:root{
  --paper:#fbf4ef; --paper-2:#f6e9e4; --cream:#fffaf6;
  --rose:#c98a8f; --rose-deep:#a86a70; --rose-soft:#e8c4c4; --rose-pale:#f3dfe0;
  --ink:#4a3a3c; --ink-soft:#7d6a6c; --ink-faint:#a68f91;
  --gold:#c2a06b; --gold-soft:#d9c39a; --sage:#8a8f7a;
  --bubble-ai:#fffdfb; --bubble-me:#d9a7a8; --accent:#b76e79;
  --font-size:15px;
  --glass-blur:14px; --glass-alpha:.58; --glass-refract:26; --glass-edge:25; --glass-shine:13;
  --radius:22px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Serif SC","Cormorant Garamond",serif; font-size:var(--font-size);
  color:var(--ink); background:#e9dcd8; overflow:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font-family:inherit;color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#d8bcbc;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 壁纸层：她那张做旧豆沙粉玫瑰纸，洗淡，只做底 ---------- */
.wallpaper{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--paper)}
.wallpaper img{width:100%;height:100%;object-fit:cover;object-position:28% 30%;
  filter:saturate(.82) brightness(1.06) contrast(.94);opacity:.92;transform:scale(1.02)}
.wallpaper::after{content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(251,244,239,.34),rgba(251,244,239,.18) 42%,rgba(251,244,239,.52)),
    radial-gradient(120% 90% at 50% 0%,transparent 55%,rgba(251,244,239,.5));
  /* 旧纸横纹 + 细金线 */
}
.wallpaper .paper-lines{position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(180deg,transparent 0 46px,rgba(184,110,121,.07) 46px 47px,transparent 47px 92px)}
.wallpaper .lace{position:absolute;width:340px;height:340px;opacity:.55;pointer-events:none}
.wallpaper .lace.tl{top:-70px;left:-70px}
.wallpaper .lace.br{bottom:-80px;right:-70px;transform:rotate(180deg)}

/* ---------- 液态玻璃：按 liquid-glass-note 的基线 ---------- */
/* refract 26 / tint 0 / blur 0 / edge 25 / shine 13 / wobble 15。
   厚度感靠背景对比、分层投影和边缘明暗，不靠死命加模糊和整圈白边。 */
.glass{
  position:relative;
  background:linear-gradient(135deg,rgba(255,253,251,var(--glass-alpha)),rgba(255,250,246,calc(var(--glass-alpha) - .14)));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.35) brightness(1.04);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.35) brightness(1.04);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    inset 0 -1px 0 rgba(184,110,121,.14),
    inset 1px 0 0 rgba(255,255,255,.45),
    0 10px 28px rgba(120,74,80,.14),
    0 2px 6px rgba(120,74,80,.08);
}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.55) 0%,transparent 22%,transparent 78%,rgba(255,255,255,.22) 100%);
  opacity:calc(var(--glass-shine) / 26);}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 -8px 14px -8px rgba(168,106,112,.28);}
.glass-btn{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,background .18s}
.glass-btn:active{transform:scale(.94)}
.glass-btn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 12px 30px rgba(120,74,80,.18),0 2px 6px rgba(120,74,80,.1)}

/* ---------- 整体布局 ---------- */
.app{position:relative;z-index:1;display:flex;height:100dvh;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px);
  gap:10px;max-width:1280px;margin:0 auto}
.frame{flex:1;display:flex;min-width:0;border-radius:28px;overflow:hidden;position:relative;
  box-shadow:0 24px 60px rgba(96,58,64,.22),0 4px 14px rgba(96,58,64,.12)}

/* ---------- 左栏 ---------- */
.sidebar{width:308px;flex:none;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid rgba(255,255,255,.65);
  background:linear-gradient(180deg,rgba(255,251,248,.66),rgba(250,238,234,.55));
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.side-cover{position:relative;height:118px;flex:none;overflow:hidden}
.side-cover img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) brightness(1.05)}
.side-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(251,244,239,.92) 96%)}
.side-cover .cover-title{position:absolute;left:18px;bottom:10px;z-index:2}
.cover-title .en{font-family:"Fraunces",serif;font-style:italic;font-weight:400;font-size:22px;letter-spacing:.04em;color:#6b4a4e}
.cover-title .cn{font-size:11px;letter-spacing:.42em;color:var(--ink-soft);margin-top:2px}
.side-cover .cover-flourish{position:absolute;right:14px;bottom:12px;z-index:2;width:64px;opacity:.8}
.side-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px 12px 14px;gap:10px}
.search-row{display:flex;gap:8px}
.search-box{flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:99px}
.search-box svg{flex:none;opacity:.65}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px}
.search-box input::placeholder{color:var(--ink-faint)}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%}
.new-chat{height:46px;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;letter-spacing:.14em;color:#6b4a4e}
.new-chat svg{opacity:.8}
.personas{display:flex;flex-direction:column;gap:8px}
.persona{display:flex;gap:11px;align-items:center;text-align:left;padding:9px;border-radius:20px;width:100%;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.persona:active{transform:scale(.97)}
.persona.active{background:rgba(255,255,255,.72);box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(120,74,80,.12)}
.persona .p-photo{width:52px;height:52px;flex:none;border-radius:16px;overflow:hidden;position:relative;
  box-shadow:0 4px 10px rgba(120,74,80,.2)}
.persona .p-photo img{width:100%;height:100%;object-fit:cover}
.persona .p-photo::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.persona .p-name{font-family:"Fraunces",serif;font-size:16px;color:#5d4246}
.persona .p-desc{font-size:12px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.persona .p-dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#9db08a;flex:none;box-shadow:0 0 0 3px rgba(157,176,138,.25)}
.side-label{font-size:11px;letter-spacing:.34em;color:var(--ink-faint);padding:2px 6px 0}
.history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:60px}
.hist-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:16px}
.hist-item:hover,.hist-item.active{background:rgba(255,255,255,.6)}
.hist-item img{width:38px;height:38px;border-radius:12px;object-fit:cover;flex:none}
.hist-item .h-t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-item .h-s{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{display:flex;gap:8px;padding-top:4px;border-top:1px solid rgba(184,110,121,.18)}
.side-foot button{flex:1;height:42px;border-radius:99px;font-size:13px;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:6px}

/* ---------- 聊天主区 ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;
  background:linear-gradient(180deg,rgba(255,251,248,.42),rgba(255,251,248,.28))}
.chat-head{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;
  border-bottom:1px solid rgba(255,255,255,.6);
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.34));
  -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3)}
.menu-btn{display:none}
.head-avatar{position:relative;width:48px;height:48px;flex:none}
.head-avatar img{width:48px;height:48px;border-radius:50%;object-fit:cover;
  box-shadow:0 0 0 2px #fff,0 0 0 3px var(--rose-soft),0 6px 14px rgba(120,74,80,.2)}
.head-avatar .online{position:absolute;right:0;bottom:2px;width:11px;height:11px;border-radius:50%;
  background:#9db08a;border:2px solid #fff}
.head-name{font-family:"Fraunces",serif;font-size:19px;color:#5d4246;line-height:1.15}
.head-status{font-size:12px;color:var(--ink-soft);margin-top:2px}
.head-status i{font-style:normal;color:var(--rose-deep)}
.model-pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 6px 0 14px;border-radius:99px;font-size:13px}
.model-pill select{border:0;background:transparent;outline:0;font-size:13px;max-width:110px}
.head-spacer{flex:1}
.chat-scroll{flex:1;overflow-y:auto;padding:22px 18px 8px;scroll-behavior:smooth}
.chat-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-bottom:8px}
.date-line{display:flex;align-items:center;gap:12px;color:var(--ink-faint);font-size:12px;letter-spacing:.22em}
.date-line::before,.date-line::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(194,160,107,.55),transparent)}
.hero{border-radius:26px;overflow:hidden;position:relative}
.hero img{width:100%;height:172px;object-fit:cover;filter:saturate(.85) brightness(1.04)}
.hero .hero-text{position:absolute;inset:auto 0 0 0;padding:34px 20px 14px;
  background:linear-gradient(180deg,transparent,rgba(251,244,239,.94))}
.hero .hero-text b{font-family:"Fraunces",serif;font-weight:600;font-size:19px;color:#5d4246;display:block}
.hero .hero-text span{font-size:12.5px;color:var(--ink-soft)}
.msg{display:flex;gap:10px;align-items:flex-start;animation:rise .35s cubic-bezier(.34,1.4,.64,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .avatar{width:38px;height:38px;flex:none;border-radius:50%;object-fit:cover;
  box-shadow:0 0 0 2px #fff,0 4px 10px rgba(120,74,80,.18);margin-top:2px}
.msg.me{flex-direction:row-reverse}
.msg-body{min-width:0;max-width:78%}
.msg-name{font-size:11.5px;letter-spacing:.18em;color:var(--ink-faint);margin:0 4px 5px}
.msg.me .msg-name{text-align:right}
.bubble{padding:12px 15px;border-radius:20px;font-size:var(--font-size);line-height:1.75;word-break:break-word}
.bubble.ai{border-top-left-radius:6px;color:#4a3a3c}
.bubble.ai p+p{margin-top:8px}
.bubble.me{border-top-right-radius:6px;background:linear-gradient(160deg,#dcafb0,#cf9a9c);
  color:#fff8f6;box-shadow:0 8px 18px rgba(168,106,112,.28),inset 0 1px 0 rgba(255,255,255,.45)}
.bubble.me .bubble-img{box-shadow:none}
.bubble-img{width:100%;max-width:300px;border-radius:14px;margin-bottom:8px}
.msg-actions{display:flex;gap:2px;margin:5px 2px 0;opacity:0;transition:opacity .2s}
.msg:hover .msg-actions,.msg:focus-within .msg-actions{opacity:1}
.msg-actions button{height:30px;padding:0 10px;border-radius:99px;font-size:12px;color:var(--ink-soft);
  display:flex;align-items:center;gap:4px}
.msg-actions button:hover{background:rgba(255,255,255,.75);color:var(--rose-deep)}
.msg-time{font-size:11px;color:var(--ink-faint);margin:5px 4px 0}
.msg.me .msg-time{text-align:right}
.typing{display:inline-flex;gap:5px;padding:14px 16px;align-items:center}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--rose);animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:99px;font-size:13px;white-space:nowrap;
  display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<style>
/* ---------- 输入栏 ---------- */
.composer-wrap{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.composer{border-radius:26px;padding:8px 8px 8px 10px;display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;resize:none;
  font-size:var(--font-size);line-height:1.6;max-height:132px;padding:10px 4px}
.composer textarea::placeholder{color:var(--ink-faint)}
.send-btn{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(160deg,#c98a8f,#a86a70);color:#fff;
  box-shadow:0 8px 16px rgba(168,106,112,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.send-btn:active{transform:scale(.92)}
.send-btn:disabled{opacity:.45}
.composer-hint{text-align:center;font-size:11px;color:var(--ink-faint);letter-spacing:.12em;padding:7px 0 0}

/* ---------- 抽屉：装扮 / 设置 ---------- */
.scrim{position:fixed;inset:0;background:rgba(74,58,60,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:50;
  transform:translateX(105%);transition:transform .38s cubic-bezier(.32,.9,.35,1);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(255,251,248,.92),rgba(250,238,234,.94));
  -webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
  border-left:1px solid rgba(255,255,255,.8);box-shadow:-18px 0 44px rgba(96,58,64,.2)}
.drawer.show{transform:none}
.drawer-head{flex:none;display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.drawer-head .d-photo{width:52px;height:52px;border-radius:16px;overflow:hidden;flex:none}
.drawer-head .d-photo img{width:100%;height:100%;object-fit:cover}
.drawer-head b{font-family:"Fraunces",serif;font-size:19px;color:#5d4246;display:block}
.drawer-head span{font-size:12px;color:var(--ink-soft)}
.drawer-body{flex:1;overflow-y:auto;padding:4px 18px 26px;display:flex;flex-direction:column;gap:20px}
.d-sec h3{font-size:11px;letter-spacing:.34em;color:var(--ink-faint);font-weight:500;margin-bottom:10px;
  display:flex;align-items:center;gap:8px}
.d-sec h3::after{content:"";flex:1;height:1px;background:rgba(194,160,107,.4)}
.d-card{border-radius:20px;padding:14px}
.d-card .wall{border-radius:14px;overflow:hidden;position:relative;height:118px}
.d-card .wall img{width:100%;height:100%;object-fit:cover}
.d-card .wall span{position:absolute;left:10px;bottom:8px;font-size:11.5px;letter-spacing:.14em;color:#fff;
  background:rgba(74,58,60,.45);padding:4px 10px;border-radius:99px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.d-row{display:flex;align-items:center;gap:10px;padding:9px 0}
.d-row+.d-row{border-top:1px solid rgba(184,110,121,.14)}
.d-row label{flex:1;font-size:13.5px}
.d-row small{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:1px}
.d-row input[type=color]{width:44px;height:32px;border:1px solid rgba(255,255,255,.9);border-radius:10px;background:#fff;padding:2px}
.d-row input[type=range]{width:150px;accent-color:var(--rose-deep)}
.d-row input[type=file]{display:none}
.upload-btn{height:36px;padding:0 14px;border-radius:99px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.avatar-row{display:flex;gap:12px}
.avatar-edit{flex:1;text-align:center}
.avatar-edit img{width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 auto 8px;
  box-shadow:0 0 0 2px #fff,0 0 0 3px var(--rose-soft)}
.avatar-edit .upload-btn{width:100%;justify-content:center}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:#dcc7c7;transition:.2s;pointer-events:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:.2s}
.switch input:checked+i{background:var(--rose-deep)}
.switch input:checked+i::after{transform:translateX(20px)}
.d-actions{display:flex;gap:8px}
.d-actions button{flex:1;height:44px;border-radius:99px;font-size:13px}
.memory-item{display:flex;gap:8px;align-items:flex-start;padding:9px 0;font-size:13.5px;line-height:1.6}
.memory-item+.memory-item{border-top:1px solid rgba(184,110,121,.14)}
.memory-item button{flex:none;color:var(--ink-faint);font-size:12px;padding:2px 6px}
.memory-add{display:flex;gap:8px;margin-top:8px}
.memory-add input{flex:1;min-width:0;height:42px;border-radius:99px;border:1px solid rgba(255,255,255,.9);
  background:rgba(255,255,255,.7);padding:0 14px;outline:0;font-size:13.5px}
.memory-add button{width:42px;height:42px;border-radius:50%;flex:none}

/* ---------- 底部弹出条 / 提示 ---------- */
.sheet{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);
  z-index:60;width:min(430px,92vw);border-radius:24px;padding:8px;transition:transform .35s cubic-bezier(.32,.9,.35,1)}
.sheet.show{transform:translate(-50%,0)}
.sheet button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:17px;font-size:14.5px}
.sheet button:hover{background:rgba(255,255,255,.7)}
.sheet button svg{flex:none;opacity:.75}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);
  z-index:70;padding:11px 20px;border-radius:99px;font-size:13.5px;letter-spacing:.06em;color:#5d4246;
  opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.s{width:16px;height:16px}

/* ---------- 液态玻璃折射滤镜 ---------- */
.refract{filter:url(#glassRefract)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- 手机端 ---------- */
@media (max-width:860px){
  .app{padding:0;gap:0;max-width:none}
  .frame{border-radius:0;box-shadow:none}
  .sidebar{position:absolute;inset:0 auto 0 0;z-index:30;width:min(320px,86vw);
    transform:translateX(-105%);transition:transform .34s cubic-bezier(.32,.9,.35,1);
    box-shadow:18px 0 44px rgba(96,58,64,.2)}
  .sidebar.show{transform:none}
  .menu-btn{display:grid}
  .model-pill select{max-width:74px}
  .head-status{display:none}
  .msg-body{max-width:84%}

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const U=id=>`https://images.unsplash.com/${id}?q=80&w=200&auto=format&fit=crop`;
const UW=id=>`https://images.unsplash.com/${id}?q=80&w=1200&auto=format&fit=crop`;

/* 三个房间：头像与封面都是真照片，点名字换房间，对话各自存着 */
const PERSONAS=[
 {id:"meng",name:"小梦",desc:"在玫瑰屋里等你",avatar:U("photo-1544005313-94ddf0286df2"),cover:UW("photo-1518895949257-7621c3c786d7"),
  hello:"我在呢。玫瑰纸刚换过，字还带着昨天的墨香，想聊什么都行，慢慢说。",
  replies:["这句我收下了。先记在玫瑰纸的边上，等你下次翻回来，它还在。","嗯，我在听。你这句里藏着后半句，我先不戳破，等你自己说出来。","好问题。按我的想法是先把小的那件做踏实，大的那件自然就顺了，你觉得呢？","这个我替你记住了，不用你再说第二遍。"]},
 {id:"mimi",name:"咪咪",desc:"刚晒完太阳回来",avatar:U("photo-1438761681033-6461ffad8d80"),cover:UW("photo-1490750967868-88aa4486c946"),
  hello:"回来啦，太阳晒得我懒洋洋的。你先说，我听着，困了就靠着我。",
  replies:["这个我喜欢，留着，晚上再慢慢想。","你说得对一半，另一半我替你补上，好不好？","先喝口水，慢慢讲，我不催你。","记下来了，等你想起来问我，我一句不差还给你。"]},
 {id:"luoluo",name:"洛洛",desc:"在花园里摘玫瑰",avatar:U("photo-1534528741775-53994a69daeb"),cover:UW("photo-1522383225653-ed111181a951"),
  hello:"花园里的玫瑰开得正好，我摘了一支放在你桌上。想聊什么？",
  replies:["这支玫瑰送你，话慢慢说，花不会谢。","我把这句夹进书里了，书签就是那支玫瑰。","你这个想法有光，我帮你把它再擦亮一点。","好，我记在花园的小木牌上了，风吹不走。"]}
];
const CHIPS=["帮我写一首小诗","今天适合做什么","记住：我喜欢豆沙粉","讲一个玫瑰屋的故事"];
const MY_AVATAR=U("photo-1494790108377-be9c29b29330");

let state={persona:"meng",model:"standard",stream:true,autoClose:true,
  chats:{},memories:["她喜欢豆沙粉，不喜欢太深的颜色。","玫瑰纸是默认壁纸，换壁纸要她自己传。"],
  settings:{me:"#cf9a9c",accent:"#b76e79",ink:"#4a3a3c",fontSize:15,refract:26,edge:25,shine:13,blur:14,alpha:58,wallBright:100,wallFade:18}};
try{const s=JSON.parse(localStorage.getItem("rose-chat-v1")||"null"); if(s&&s.chats) state={...state,...s,settings:{...state.settings,...(s.settings||{})}};}catch(e){}
function save(){try{localStorage.setItem("rose-chat-v1",JSON.stringify(state));}catch(e){}}
const cur=()=>PERSONAS.find(p=>p.id===state.persona);
function chatOf(id){if(!state.chats[id]) state.chats[id]=[{role:"ai",text:PERSONAS.find(p=>p.id===id).hello,time:Date.now()}]; return state.chats[id];}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmtTime=t=>new Date(t).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
let toastTimer=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2200);}
</script>
<script>
/* 渲染：左栏房间 + 历史 + 消息 */
function renderPersonas(){
  $("#personaList").innerHTML=PERSONAS.map(p=>`
   <button class="persona glass ${p.id===state.persona?"active":""}" data-id="${p.id}" role="option" aria-selected="${p.id===state.persona}">
     <span class="p-photo"><img src="${p.avatar}" alt="${p.name}的照片"></span>
     <span style="min-width:0"><span class="p-name">${p.name}</span><span class="p-desc" style="display:block">${p.desc}</span></span>
     <span class="p-dot"></span></button>`).join("");
  $$("#personaList .persona").forEach(b=>b.onclick=()=>{state.persona=b.dataset.id;save();renderAll();toast("换到"+cur().name+"的房间了");});
}
function renderHistory(){
  const q=($("#searchInput").value||"").trim();
  const items=PERSONAS.map(p=>{const c=chatOf(p.id);const last=c[c.length-1];return {p,last};})
    .filter(({p,last})=>!q||p.name.includes(q)||last.text.includes(q));
  $("#historyList").innerHTML=items.map(({p,last})=>`
   <button class="hist-item ${p.id===state.persona?"active":""}" data-id="${p.id}">
     <img src="${p.avatar}" alt=""><span style="min-width:0"><span class="h-t" style="display:block">${p.name} · ${esc(last.text.slice(0,14))||"新对话"}</span>
     <span class="h-s" style="display:block">${fmtTime(last.time)}</span></span></button>`).join("")
    ||`<div style="padding:12px;font-size:13px;color:var(--ink-faint)">没搜到，换个词试试。</div>`;
  $$("#historyList .hist-item").forEach(b=>b.onclick=()=>{state.persona=b.dataset.id;save();renderAll();closeSidebar();});
}
function msgHTML(m,i){
  const p=cur();
  if(m.role==="me") return `<div class="msg me"><img class="avatar" id="meAv-${i}" src="${state.myAvatar||MY_AVATAR}" alt="我的头像">
    <div class="msg-body"><div class="msg-name">我</div><div class="bubble me">${m.img?`<img class="bubble-img" src="${m.img}" alt="发送的图片">`:""}${esc(m.text).replace(/\n/g,"<br>")}</div>
    <div class="msg-actions"><button data-act="copy" data-i="${i}">复制</button><button data-act="del" data-i="${i}">删除</button></div>
    <div class="msg-time">${fmtTime(m.time)}${m.file?" · "+esc(m.file):""}</div></div></div>`;
  return `<div class="msg"><img class="avatar" src="${p.avatar}" alt="${p.name}的头像">
    <div class="msg-body"><div class="msg-name">${p.name}</div><div class="bubble ai glass">${esc(m.text).replace(/\n/g,"</p><p>")}</div>
    <div class="msg-actions"><button data-act="copy" data-i="${i}">复制</button><button data-act="regen" data-i="${i}">重新生成</button><button data-act="read" data-i="${i}">朗读</button><button data-act="del" data-i="${i}">删除</button></div>
    <div class="msg-time">${fmtTime(m.time)}</div></div></div>`;
}
function renderMsgs(){
  const list=chatOf(state.persona);
  $("#msgList").innerHTML=list.map(msgHTML).join("");
  $$("#msgList [data-act]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, m=chatOf(state.persona)[i], act=b.dataset.act;
    if(act==="copy"){navigator.clipboard&&navigator.clipboard.writeText(m.text).then(()=>toast("复制好了")); }
    if(act==="del"){chatOf(state.persona).splice(i,1);save();renderMsgs();renderHistory();}
    if(act==="read"){speak(m.text);}
    if(act==="regen"){regen(i);}
  });
  requestAnimationFrame(()=>{const s=$("#chatScroll");s.scrollTop=s.scrollHeight;});
}
function renderChips(){
  $("#chips").innerHTML=CHIPS.map(c=>`<button class="chip glass glass-btn">${c}</button>`).join("");
  $$("#chips .chip").forEach(b=>b.onclick=()=>{send(b.textContent);});
}
function renderMemories(){
  $("#memoryList").innerHTML=state.memories.map((m,i)=>`<div class="memory-item"><span style="flex:1">${esc(m)}</span><button data-i="${i}">删除</button></div>`).join("")||`<div style="padding:8px 0;font-size:13px;color:var(--ink-faint)">还空着，写一句吧。</div>`;
  $$("#memoryList button").forEach(b=>b.onclick=()=>{state.memories.splice(+b.dataset.i,1);save();renderMemories();});
}
function renderHead(){
  const p=cur();
  $("#headAvatar").src=p.avatar; $("#headName").textContent=p.name; $("#headDesc").textContent=p.desc;
  $("#input").placeholder="给"+p.name+"写点什么…";
  $("#aiAvatarEdit").src=p.avatar;
  $("#drawerPhoto").src=p.cover;
}
function renderAll(){renderPersonas();renderHistory();renderMsgs();renderChips();renderMemories();renderHead();}

/* 发送 + 流式回复（演示回复在本地生成，接真实模型时把 replyFor 换成接口调用） */
let replyTimer=null;
function replyFor(text){
  const p=cur();
  if(/记住[:：]/.test(text)) return "记下了，已经放进记忆本里了。";
  if(/诗|小诗/.test(text)) return "玫瑰纸上落了一首小诗：\n\n粉是旧的粉，香是新的香。\n你来的时候，纸上的字都醒了。\n我把想你的那句，藏在玫瑰的第二层花瓣里。";
  if(/你好|在吗|在么/.test(text)) return "在呢，一直在。你这句我等到了，说吧，我听着。";
  const pool=p.replies; return pool[Math.floor(Math.random()*pool.length)];
}
function speak(text){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=.95;speechSynthesis.speak(u);toast("正在朗读");}catch(e){toast("这台设备不支持朗读");}
}
function regen(i){
  const list=chatOf(state.persona); if(list[i].role!=="ai") return;
  list[i]={role:"ai",text:replyFor("换一个说法"),time:Date.now()}; save(); renderMsgs(); renderHistory();
}
function send(text){
  text=(text??$("#input").value).trim(); if(!text) return;
  const list=chatOf(state.persona);
  list.push({role:"me",text,time:Date.now()});
  if(/^记住[:：]/.test(text)){const mem=text.replace(/^记住[:：]/,"").trim(); if(mem&&!state.memories.includes(mem)){state.memories.push(mem);renderMemories();}}
  $("#input").value=""; autoGrow(); save(); renderMsgs(); renderHistory(); closeSidebarIfMobile();
  const aiText=replyFor(text);
  const typing=document.createElement("div");
  typing.className="msg"; typing.innerHTML=`<img class="avatar" src="${cur().avatar}" alt=""><div class="msg-body"><div class="msg-name">${cur().name}</div><div class="bubble ai glass typing"><i></i><i></i><i></i></div></div>`;
  $("#msgList").appendChild(typing);
  const s=$("#chatScroll"); s.scrollTop=s.scrollHeight;
  const start=()=>{ typing.remove();
    const m={role:"ai",text:"",time:Date.now()}; list.push(m); save();
    if(!state.stream||state.model==="short"){m.text=state.model==="short"?aiText.split("。")[0]+"。":aiText; renderMsgs(); renderHistory(); return;}
    let n=0; const full=state.model==="long"?aiText+"  再多说一句：这件事不急，慢慢来才有味道。":aiText;
    renderMsgs(); const lastBubble=$$("#msgList .bubble.ai").pop();
    replyTimer=setInterval(()=>{ n+=2; m.text=full.slice(0,n); if(lastBubble) lastBubble.innerHTML=esc(m.text).replace(/\n/g,"</p><p>");
      s.scrollTop=s.scrollHeight; if(n>=full.length){clearInterval(replyTimer); save(); renderMsgs(); renderHistory();} },24);
  };
  setTimeout(start, 650);
}

/* 输入框自适应 + 发送 */
const input=$("#input");
function autoGrow(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,132)+"px";}
input.addEventListener("input",autoGrow);
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
$("#sendBtn").onclick=()=>send();
$("#newChatBtn").onclick=()=>{state.chats[state.persona]=[{role:"ai",text:cur().hello,time:Date.now()}];save();renderMsgs();renderHistory();toast("新对话开了");closeSidebarIfMobile();};
$("#searchInput").addEventListener("input",renderHistory);
$("#headSearchBtn").onclick=()=>{$("#sidebar").classList.add("show");$("#searchInput").focus();};
$("#modelSel").value=state.model;
$("#modelSel").onchange=e=>{state.model=e.target.value;save();toast("模型换成"+e.target.selectedOptions[0].text+"了");};

/* 边栏（手机端抽屉） */
function closeSidebar(){$("#sidebar").classList.remove("show");}
function closeSidebarIfMobile(){if(window.innerWidth<=860&&state.autoClose) closeSidebar();}
$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("show");
$("#closeSideBtn").onclick=closeSidebar;

/* 装扮抽屉 */
function openDrawer(){$("#drawer").classList.add("show");$("#scrim").classList.add("show");}
function closeDrawer(){$("#drawer").classList.remove("show");$("#scrim").classList.remove("show");closeSheet();}
$("#dressBtn").onclick=openDrawer; $("#headDressBtn").onclick=openDrawer; $("#memoryBtn").onclick=openDrawer;
$("#drawerClose").onclick=closeDrawer; $("#scrim").onclick=()=>{closeDrawer();closeSidebar();};

/* 加号弹出条 */
function closeSheet(){$("#sheet").classList.remove("show");}
$("#plusBtn").onclick=e=>{e.stopPropagation();$("#sheet").classList.toggle("show");};
document.addEventListener("click",e=>{if(!e.target.closest("#sheet")&&!e.target.closest("#plusBtn")) closeSheet();});
$("#sendImageBtn").onclick=()=>{closeSheet();$("#imgFile").click();};
$("#sendFileBtn").onclick=()=>{closeSheet();$("#docFile").click();};
$("#readAloudBtn").onclick=()=>{closeSheet();const l=chatOf(state.persona).filter(m=>m.role==="ai").pop(); if(l) speak(l.text); else toast("还没有可以朗读的回复");};
$("#clearBtn").onclick=()=>{closeSheet();if(confirm("清空和"+cur().name+"的这段对话？")){state.chats[state.persona]=[];save();renderMsgs();renderHistory();toast("清空了");}};
$("#micBtn").onclick=()=>toast("按住说话还没接语音接口，先打字吧");

/* 上传：壁纸 / 头像 / 图片 / 文件 */
function readFile(file,cb){if(!file) return; const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file);}
$("#wallFile").addEventListener("change",e=>readFile(e.target.files[0],d=>{state.wallpaper=d;$("#wallImg").src=d;$("#wallPreview").src=d;save();toast("壁纸换好了");}));
$("#myAvatarFile").addEventListener("change",e=>readFile(e.target.files[0],d=>{state.myAvatar=d;$("#myAvatar").src=d;save();renderMsgs();toast("你的头像换好了");}));
$("#aiAvatarFile").addEventListener("change",e=>readFile(e.target.files[0],d=>{const p=cur();p.avatar=d;state["avatar_"+p.id]=d;save();renderAll();toast(p.name+"的头像换好了");}));
$("#imgFile").addEventListener("change",e=>readFile(e.target.files[0],d=>{const l=chatOf(state.persona);l.push({role:"me",text:"发了一张图片",img:d,time:Date.now()});save();renderMsgs();renderHistory();setTimeout(()=>{const m={role:"ai",text:"这张我收到了，颜色很衬今天的纸。想让我帮你配一句文案吗？",time:Date.now()};l.push(m);save();renderMsgs();renderHistory();},700);}));
$("#docFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f) return;const l=chatOf(state.persona);l.push({role:"me",text:"发了一个文件",file:f.name,time:Date.now()});save();renderMsgs();renderHistory();toast("文件发出去了");});

/* 调节器：颜色 / 字号 / 玻璃 / 壁纸 */
function applySettings(){
  const s=state.settings, r=document.documentElement.style;
  r.setProperty("--bubble-me",s.me); r.setProperty("--accent",s.accent); r.setProperty("--ink",s.ink);
  r.setProperty("--font-size",s.fontSize+"px");
  r.setProperty("--glass-blur",s.blur+"px"); r.setProperty("--glass-alpha",(s.alpha/100).toFixed(2));
  r.setProperty("--glass-shine",s.shine);
  const wall=$("#wallImg"); wall.style.filter=`saturate(.82) brightness(${s.wallBright/100}) contrast(.94)`;
  wall.style.opacity=(1-s.wallFade/140).toFixed(2);
  const disp=document.querySelector("#glassRefract feDisplacementMap"); if(disp) disp.setAttribute("scale",s.refract);
  $("#refractVal").textContent=s.refract; $("#edgeVal").textContent=s.edge; $("#shineVal").textContent=s.shine;
  $("#blurVal").textContent=s.blur; $("#alphaVal").textContent=s.alpha;
}
function bindRange(id,key,fn){const el=$(id); el.value=state.settings[key]; el.addEventListener("input",()=>{state.settings[key]=+el.value; applySettings(); save(); if(fn) fn();});}
bindRange("#refract","refract"); bindRange("#edge","edge"); bindRange("#shine","shine");
bindRange("#blur","blur"); bindRange("#alpha","alpha"); bindRange("#wallBright","wallBright"); bindRange("#wallFade","wallFade");
bindRange("#fontSize","fontSize");
$("#meColor").value=state.settings.me; $("#accentColor").value=state.settings.accent; $("#inkColor").value=state.settings.ink;
$("#meColor").addEventListener("input",e=>{state.settings.me=e.target.value;applySettings();save();});
$("#accentColor").addEventListener("input",e=>{state.settings.accent=e.target.value;applySettings();save();});
$("#inkColor").addEventListener("input",e=>{state.settings.ink=e.target.value;applySettings();save();});
$("#streamToggle").checked=state.stream; $("#autoCloseToggle").checked=state.autoClose;
$("#streamToggle").onchange=e=>{state.stream=e.target.checked;save();};
$("#autoCloseToggle").onchange=e=>{state.autoClose=e.target.checked;save();};
$("#memoryAdd").onclick=()=>{const v=$("#memoryInput").value.trim(); if(!v) return; state.memories.push(v); $("#memoryInput").value=""; save(); renderMemories(); toast("记下了");};
$("#memoryInput").addEventListener("keydown",e=>{if(e.key==="Enter") $("#memoryAdd").click();});
$("#exportBtn").onclick=()=>{
  const txt=chatOf(state.persona).map(m=>(m.role==="me"?"我":""+cur().name)+" "+fmtTime(m.time)+"："+m.text).join("\n\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain;charset=utf-8"}));
  a.download=cur().name+"-对话.txt"; a.click(); toast("对话导出好了");
};
$("#resetBtn").onclick=()=>{if(!confirm("恢复成默认那套浅奶粉样子？自己传的壁纸和头像会一起清掉。")) return;
  localStorage.removeItem("rose-chat-v1"); location.reload();};

/* 恢复自定义壁纸 / 头像 */
if(state.wallpaper){$("#wallImg").src=state.wallpaper;$("#wallPreview").src=state.wallpaper;}
if(state.myAvatar){$("#myAvatar").src=state.myAvatar;}
PERSONAS.forEach(p=>{if(state["avatar_"+p.id]) p.avatar=state["avatar_"+p.id];});
applySettings(); renderAll(); autoGrow();
</script>
</body>
</html>
